name: Tests Badge
description: Badges for test results

# Required for publishing to the marketplace:
# Improve your Action by adding labels for icon and color.
branding:
  icon: check-circle
  color: green

runs:
  using: composite
  steps:
    - name: Get Values
      id: get-values
      shell: bash
      run: |
        if [ -f ".report.json" ]; then
          PASSED=$(python -c 'import json; print(json.load(open(".report.json"))["summary"]["passed"])')
          TOTAL=$(python -c 'import json; print(json.load(open(".report.json"))["summary"]["total"])')
        else
          echo "Error: .report.json not found."
          exit 1
        fi
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "total=$TOTAL" >> $GITHUB_OUTPUT

      # pretend to be still https://github.com/stefanzweifel/git-auto-commit-action/blob/master/action.yml
    - name: Git Config
      shell: bash
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com

    - name: Pick Deploy Branch
      id: pick-deploy-branch
      shell: bash
      run: |
        IS_DEFAULT_BRANCH=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        DEPLOY_BRANCH=$([ "$IS_DEFAULT_BRANCH" = true ] && echo 'gh-pages' || echo 'gh-pages-debug')
        echo "deploy_branch=$DEPLOY_BRANCH" >> $GITHUB_OUTPUT
        if git ls-remote --exit-code --heads origin $DEPLOY_BRANCH; then
          echo "Branch $DEPLOY_BRANCH exists."
        else
          git switch --orphan $DEPLOY_BRANCH
          git commit --allow-empty -m "Initial commit"
          git push -u origin $DEPLOY_BRANCH
          echo "Branch $DEPLOY_BRANCH created."
        fi

    - name: Checkout ${{ steps.pick-deploy-branch.outputs.deploy_branch }}
      uses: actions/checkout@v3
      with:
        ref: ${{ steps.pick-deploy-branch.outputs.deploy_branch }}

    - name: Create Badges
      shell: bash
      env:
        PASSED: ${{ steps.get-values.outputs.passed }}
        TOTAL: ${{ steps.get-values.outputs.total }}
      run: |
        npm i -g badgen-cli
        COLOR='gray'
        badgen -j tests -s "total: $TOTAL, passed: $PASSED" -c $COLOR > $RUNNER_TEMP/tests.svg

    - name: Deploy Badges
      uses: Wandalen/wretry.action@master
      with:
        attempt_limit: 3
        attempt_delay: 2000
        command: |
          git fetch origin ${{ steps.pick-deploy-branch.outputs.deploy_branch }}
          git reset --hard origin/${{ steps.pick-deploy-branch.outputs.deploy_branch }}
          mkdir -p badges
          mv $RUNNER_TEMP/tests.svg badges/
          git add badges/tests.svg
          git commit -m 'Update badges [skip ci]'
          git push

    # Without this, will get Error:
    # Can't find 'action.yml', 'action.yaml' or 'Dockerfile' under '/home/runner/work/coverage-badge-action/coverage-badge-action/action.yml'.
    # Did you forget to run actions/checkout before running your local action?
    - name: Checkout Back
      uses: actions/checkout@v3
      with:
        ref: ${{ github.ref }}
